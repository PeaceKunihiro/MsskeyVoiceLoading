<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Misskey Reader 設定</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 620px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.5rem; }
    form { display: grid; gap: 18px; }
    label { display: grid; gap: 6px; }
    label.checkbox { display: flex; align-items: center; gap: 8px; }
    input, select, button { font: inherit; padding: 8px; }
    small { opacity: .75; }
    .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .speaker-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
    #status { min-height: 2.5em; white-space: pre-line; }
    #status[data-kind="success"] { color: #48a868; }
    #status[data-kind="error"] { color: #d95757; }
  </style>
</head>
<body>
  <h1>Misskey Reader 設定</h1>
  <form id="settings">
    <label class="checkbox"><input id="enabled" type="checkbox">読み上げを有効にする</label>
    <label>VOICEVOX ENGINE URL
      <input id="voicevoxUrl" type="url" required placeholder="http://127.0.0.1:50021">
      <small>初期値はこのPC上のVOICEVOXです。別PCを指定すると、その接続先への権限確認が表示されます。</small>
    </label>
    <div class="speaker-row">
      <label>話者 / スタイル
        <select id="speaker" required><option value="3">スタイル ID 3</option></select>
      </label>
      <button id="loadSpeakers" type="button">話者一覧を取得</button>
    </div>
    <div class="row">
      <label>話速<input id="speedScale" type="number" min="0.5" max="2" step="0.05" required></label>
      <label>音高<input id="pitchScale" type="number" min="-0.15" max="0.15" step="0.01" required></label>
      <label>抑揚<input id="intonationScale" type="number" min="0" max="2" step="0.05" required></label>
      <label>音量<input id="volumeScale" type="number" min="0" max="2" step="0.05" required></label>
    </div>
    <div class="row">
      <label>ロード済ノート読み上げ数
        <input id="initialNoteCount" type="number" min="0" max="50" step="1" required>
        <small>0にすると起動時の既存ノートを読みません。</small>
      </label>
      <label>最大読み上げ文字数
        <input id="maxReadLength" type="number" min="1" max="1000" step="1" required>
      </label>
    </div>
    <label class="checkbox"><input id="removeUrls" type="checkbox">URLを読み上げない</label>
    <div class="row">
      <label>待機キュー最大件数
        <input id="maxQueueSize" type="number" min="0" max="100" step="1" required>
        <small>超過時は待機中の最古ノートを破棄します。0なら待機しません。</small>
      </label>
      <label>投稿の有効時間（秒）
        <input id="maxNoteAgeSeconds" type="number" min="0" max="86400" step="1" required>
        <small>これより古いノートはキューへ入れません。0なら無制限です。</small>
      </label>
    </div>
    <div class="row">
      <button type="submit">保存</button>
      <button id="test" type="button">テスト読み上げ</button>
    </div>
    <output id="status" role="status"></output>
  </form>
  <script src="options.js"></script>
</body>
</html>
