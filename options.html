<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Misskey Reader 設定</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 560px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.5rem; }
    form { display: grid; gap: 18px; }
    label { display: grid; gap: 6px; }
    label.checkbox { display: flex; align-items: center; gap: 8px; }
    input, button { font: inherit; padding: 8px; }
    .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    #status { min-height: 1.5em; color: #48a868; }
  </style>
</head>
<body>
  <h1>Misskey Reader 設定</h1>
  <form id="settings">
    <label class="checkbox"><input id="enabled" type="checkbox">読み上げを有効にする</label>
    <label>WebSocket Plugin URL<input id="websocketUrl" type="url" required pattern="wss?://(localhost|127\.0\.0\.1)(:[0-9]+)?/.*" placeholder="ws://localhost:55000/"><small>棒読みちゃん本体のTCPポート50001は指定できません。WebSocket Pluginの待受ポートを指定してください。</small></label>
    <div class="row">
      <label>速度<input id="speed" type="number" min="-1" max="300"></label>
      <label>音量<input id="volume" type="number" min="-1" max="100"></label>
      <label>ピッチ（音程）<input id="pitch" type="number" min="-1" max="200"></label>
      <label>声質 ID<input id="voice" type="number" min="0"></label>
    </div>
    <div class="row">
      <button type="submit">保存</button>
      <button id="test" type="button">テスト読み上げ</button>
    </div>
    <output id="status" role="status"></output>
  </form>
  <script src="options.js"></script>
</body>
</html>
